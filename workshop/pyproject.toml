[project]
name = "grpc-chat-workshop"
version = "0.1.0"
description = "gRPC Chat Service — EuroPython 2026 Workshop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.64.0",
  "grpcio-tools>=1.64.0",
  "grpcio-reflection>=1.64.0",
  "typer>=0.12.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
  "poethepoet>=0.27.0",
  "mypy-protobuf>=5.1.0",
  "types-grpcio>=1.83.0",
]

[tool.poe.tasks]
test-exercises = { sequence = [{ ref = "generate-exercises" }, { cmd = "pytest tests/exercises/ -v" }], help = "Run all exercise tests" }
test-01 = { sequence = [{ ref = "generate-exercises" }, { cmd = "pytest tests/exercises/test_01_proto.py -v" }], help = "Run only the Exercise 01 tests" }
test-02 = { sequence = [{ ref = "generate-exercises" }, { cmd = "pytest tests/exercises/test_02_service_stub.py -v" }], help = "Run only the Exercise 02 tests" }
test-03 = { sequence = [{ ref = "generate-exercises" }, { cmd = "pytest tests/exercises/test_03_unary_service.py -v" }], help = "Run only the Exercise 03 tests" }
test-04 = { sequence = [{ ref = "generate-exercises" }, { cmd = "pytest tests/exercises/test_04_unary_client.py -v" }], help = "Run only the Exercise 04 tests" }
test-05 = { sequence = [{ ref = "generate-exercises" }, { cmd = "pytest tests/exercises/test_05_streaming.py -v" }], help = "Run only the Exercise 05 tests" }
test-06 = { sequence = [{ ref = "generate-exercises" }, { cmd = "pytest tests/exercises/test_06_deadlines_cancellation_errors.py -v" }], help = "Run only the Exercise 06 tests" }
test-07 = { sequence = [{ ref = "generate-exercises" }, { cmd = "pytest tests/exercises/test_07_final_chat_client.py -v" }], help = "Run only the Exercise 07 tests" }
test-08 = { sequence = [{ ref = "generate-exercises" }, { cmd = "pytest tests/exercises/test_08_broadcast_chat.py -v" }], help = "Run only the Exercise 08 (bonus) tests" }
test-09 = { sequence = [{ ref = "generate-exercises" }, { cmd = "pytest tests/exercises/test_09_metadata_interceptors.py -v" }], help = "Run only the Exercise 09 (bonus) tests" }
lint = "ruff check ."
fmt = "ruff format ."

[tool.poe.tasks.server]
sequence = [
  { ref = "generate-exercises" },
  { cmd = "python -m exercises.main server" },
]
help = "Start the gRPC chat server (regenerating stubs from chat.proto first)"

[tool.poe.tasks.server-broadcast]
sequence = [
  { ref = "generate-exercises" },
  { cmd = "python exercises/08_broadcast_chat/server_broadcast.py" },
]
help = "Start the Exercise 8 broadcast chat server (bonus)"

[tool.poe.tasks.server-intercepted]
sequence = [
  { ref = "generate-exercises" },
  { cmd = "python exercises/09_metadata_interceptors/interceptors.py --serve" },
]
help = "Start the chat server with auth + logging interceptors (bonus)"

[tool.poe.tasks.client-intercepted]
cmd = "python exercises/09_metadata_interceptors/interceptors.py"
help = "Run the metadata/interceptor client demo (bonus)"

[tool.poe.tasks.client-send]
cmd = "python -m exercises.main client send"
help = "Send a single message (unary)"

[tool.poe.tasks.client-history]
cmd = "python -m exercises.main client history"
help = "Fetch message history (server streaming)"

[tool.poe.tasks.client-bulk]
cmd = "python -m exercises.main client bulk"
help = "Send several messages in one call (client streaming)"

[tool.poe.tasks.client-chat]
cmd = "python -m exercises.main client chat"
help = "Interactive bidirectional chat"

[tool.poe.tasks.final-send]
cmd = "python exercises/07_final_chat_client/client.py send"
help = "Exercise 7: send a message with your final client (unary)"

[tool.poe.tasks.final-history]
cmd = "python exercises/07_final_chat_client/client.py history"
help = "Exercise 7: fetch history with your final client (server streaming)"

[tool.poe.tasks.final-chat]
cmd = "python exercises/07_final_chat_client/client.py chat"
help = "Exercise 7: interactive chat with your final client (bidirectional)"

[tool.poe.tasks.starter-04]
cmd = "python exercises/04_unary_client/client_starter.py"
help = "Run the Exercise 4 client starter"

[tool.poe.tasks.starter-05]
cmd = "python exercises/05_streaming/streaming_starter.py"
help = "Run the Exercise 5 streaming starter"

[tool.poe.tasks.starter-06]
cmd = "python exercises/06_deadlines_cancellation_errors/deadlines_starter.py"
help = "Run the Exercise 6 deadlines/cancellation starter"

[tool.poe.tasks.generate-exercises]
sequence = [
  { cmd = "python -c \"import pathlib,shutil; d=pathlib.Path('exercises/generated'); [f.unlink() for p in ('*_pb2*.py','*.pyi') for f in d.glob(p)]; shutil.rmtree(d/'__pycache__', ignore_errors=True)\"" },
  { cmd = "python -m grpc_tools.protoc -I exercises/01_protocol_buffers --python_out=exercises/generated --mypy_out=exercises/generated --mypy_grpc_out=exercises/generated --grpc_python_out=exercises/generated exercises/01_protocol_buffers/chat.proto" },
  { cmd = "python -c \"import pathlib; f=pathlib.Path('exercises/generated/chat_pb2_grpc.py'); f.write_text(f.read_text().replace('import chat_pb2 as chat__pb2', 'from . import chat_pb2 as chat__pb2'))\"" },
]

[tool.ruff]
line-length = 88
target-version = "py313"
# Generated protobuf/gRPC code is not ours to lint, and .venv is listed
# explicitly because ruff only skips it via .gitignore inside a git checkout.
exclude = ["exercises/generated", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Starter scripts intentionally leave imports and variables unused: the
# participant needs them to fill in the TODOs, so `ruff --fix` must not strip
# them (F401) and an unused binding is the exercise, not a defect (F841).
"exercises/04_unary_client/client_starter.py" = ["F401", "F841"]
"exercises/05_streaming/streaming_starter.py" = ["F401", "F841"]
"exercises/06_deadlines_cancellation_errors/deadlines_starter.py" = ["F401", "F841"]
"exercises/07_final_chat_client/client.py" = ["F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests/exercises"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exercises"]
