services:
  # ── Dev shell ────────────────────────────────────────────────────────────────
  # Interactive environment with all tools (poe, pytest, ruff).
  # Your local files are mounted, so edits are reflected instantly.
  #
  # Quick-start:
  #   docker compose run --rm workshop bash          # open a shell
  #   docker compose run --rm workshop poe test-exercises
  #   docker compose run --rm workshop poe lint
  workshop:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true

  server:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["poe", "server"]
    ports:
      - "50051:50051"   # gRPC
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c",
             "import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
